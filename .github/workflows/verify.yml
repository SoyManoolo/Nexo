name: Verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nexo_test
          POSTGRES_USER: nexo_test
          POSTGRES_PASSWORD: nexo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexo_test -d nexo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://nexo_test:nexo_test@127.0.0.1:5432/nexo_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nexo/api db:migrate
      - run: pnpm --filter @nexo/api exec tsx --test test/schema.test.ts
      - run: pnpm verify
